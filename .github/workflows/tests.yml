name: Tests

on:
  push:
    branches: [ main, hotfix/*, release/* ]
  pull_request:

jobs:
  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: padel_test
          POSTGRES_PASSWORD: padel_test
          POSTGRES_DB: padel_quento_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U padel_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgres://padel_test:padel_test@localhost:5432/padel_quento_test
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Run integration tests
        run: pnpm test:integration
