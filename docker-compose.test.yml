services:
  test-db:
    image: postgres:16-alpine
    container_name: padel-quento-test-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:-padel_test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-padel_test}
      POSTGRES_DB: ${TEST_POSTGRES_DB:-padel_quento_test}
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
