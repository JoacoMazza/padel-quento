services:
  db:
    image: postgres:16-alpine
    container_name: padel-quento-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - padel_quento_pgdata:/var/lib/postgresql/data

volumes:
  padel_quento_pgdata:
